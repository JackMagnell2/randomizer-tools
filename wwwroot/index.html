<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>RandomizerTools</title>
    <base href="/" />
    <script>
        (function () {
            try {
                const storageKey = 'theme-preference';
                const stored = localStorage.getItem(storageKey);
                const prefersDark = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches;
                const theme = stored || (prefersDark ? 'dark' : 'light');
                document.documentElement.dataset.theme = theme;
                document.body?.setAttribute('data-theme', theme);
            } catch { }
        })();
    </script>
    <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;600;700&family=Quicksand:wght@400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="lib/bootstrap/dist/css/bootstrap.min.css" />
    <link rel="stylesheet" href="css/app.css" />
    <link rel="manifest" href="manifest.json" />
    <link rel="icon" type="image/png" href="favicon.png" />
    <link href="RandomizerTools.styles.css" rel="stylesheet" />
</head>

<body>
    <div id="app">
        <div style="position:absolute; top:50%; left:50%; transform:translate(-50%, -50%); text-align:center;">
            <h1 style="font-family: 'Fredoka', sans-serif; color: #ffeb3b; text-transform: uppercase; font-size: 3rem; margin: 0; text-shadow: 0 4px 0 rgba(0,0,0,0.3); animation: breathe 2s infinite ease-in-out;">
                RandomizerTools
            </h1>
            <p style="color: rgba(255,255,255,0.6); font-family: sans-serif; margin-top: 10px; font-size: 0.9rem;">
                Loading...
            </p>
        </div>
        <style>
            @keyframes breathe {
                0% { opacity: 1; transform: scale(1); }
                50% { opacity: 0.7; transform: scale(0.95); }
                100% { opacity: 1; transform: scale(1); }
            }
            body {
                background-color: var(--bg-main);
                margin: 0;
            }
        </style>
    </div>

    <div id="blazor-error-ui">
        An unhandled error has occurred.
        <a href="." class="reload">Reload</a>
        <span class="dismiss">🗙</span>
    </div>
    <script src="_framework/blazor.webassembly.js"></script>
    <script src="js/theme.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
    <script src="js/wheel.js"></script>
    <script src="js/coin.js"></script>
    <script src="js/dice.js"></script>
    <script src="js/number.js"></script>
    <script src="js/team.js"></script>
    <script src="js/shuffler.js"></script>
    <script src="js/password.js"></script>
</body>

</html>
